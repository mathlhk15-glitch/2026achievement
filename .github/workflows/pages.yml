name: Build and publish explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Convert source documents
        shell: pwsh
        run: |
          python scripts/build.py
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            if (Test-Path -LiteralPath 'reports/failed-import.json') {
              $failureReport = Get-Content -LiteralPath 'reports/failed-import.json' -Raw -Encoding utf8 | ConvertFrom-Json
              $failureReport.errors | ConvertTo-Json -Depth 10 | Write-Output
            }
            exit $buildExitCode
          }
      - name: Verify content and links
        shell: pwsh
        run: |
          python scripts/validate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_importer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check public/assets/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_frontend.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
